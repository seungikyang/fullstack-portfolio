<!-- 자기소개 페이지의 구조를 연습하는 HTML 문서 -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>____의 자기소개</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Fullstack Study</p>
      <h1>안녕하세요, 저는 ____입니다.</h1>
      <p class="intro">
        ____ 분야에 관심이 있고, SI/SW 개발자로 성장하고 싶습니다.
      </p>
    </header>

    <main>
      <section class="profile-card" aria-label="프로필">
        <!-- 힌트: 사진이 없으면 임시 이미지 주소를 써도 됩니다. 예) https://placehold.co/320x320?text=Profile -->
        <img src="____" alt="____의 프로필 이미지" class="profile-image" />
        <div>
          <h2>나를 소개합니다</h2>
          <p>
            저는 ____을 좋아하고, 앞으로 ____을 만들 수 있는 개발자가 되고 싶습니다.
          </p>
          <a class="contact-link" href="mailto:____">연락하기</a>
        </div>
      </section>

      <section class="skills-section" aria-labelledby="skills-title">
        <h2 id="skills-title">관심 기술</h2>
        <ul class="skill-grid">
          <li>HTML</li>
          <li>CSS</li>
          <li>____</li>
          <li>____</li>
        </ul>
      </section>

      <section class="goal-section" aria-labelledby="goal-title">
        <h2 id="goal-title">이번 주 목표</h2>
        <p>이번 주에는 ____을 직접 만들고 설명할 수 있게 됩니다.</p>
      </section>
    </main>
  </body>
</html>
