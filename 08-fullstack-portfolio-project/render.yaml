# Render.com Blueprint. 저장소 루트에 두면 "New + Blueprint"에서 자동 인식한다.
# Career Hub는 단일 컨테이너(정적 web + Express API)라서 web 서비스 한 개로 충분하다.
# Render free 배포는 화면 시연용이다. 파일시스템이 임시라 재시작·재배포 뒤 JSON 데이터 보존을 보장하지 않는다.

services:
  - type: web
    name: career-hub
    runtime: docker
    region: singapore # 한국과 가장 가까운 리전 (oregon/frankfurt 대비)
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5100
      - key: JWT_SECRET
        generateValue: true # Render가 안전한 임의값을 생성해 채워준다
      - key: SEED_DEMO
        value: "false"
